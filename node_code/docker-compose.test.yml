# Disposable test services, separate from docker-compose.yml and development data.
name: dmlink-integration-tests
services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: instagram_automation_test
      POSTGRES_USER: integration
      POSTGRES_PASSWORD: integration-only
    ports:
      - "127.0.0.1:${TEST_POSTGRES_PORT:-15432}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U integration -d instagram_automation_test"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis-test:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
